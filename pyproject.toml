[project]
name = "enterprise-agents-on-foundry"
version = "0.3.0"
description = "A progressive, notebook-first learning laboratory for modern enterprise agents on Microsoft Foundry."
readme = "README.md"
authors = [
    { name = "Shiva Chittamuru", email = "shiva.vy147@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "langchain-azure-ai[hosting]>=1.2.4",
    "langchain-core>=1.2.0",
    "langchain-openai>=1.2.0",
    "langgraph>=1.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# pyodbc also needs the Microsoft ODBC Driver 18 for SQL Server, which is a
# system package rather than a wheel. It stays optional so that cloning the
# repository and running the tests never requires a native driver install.
database = [
    "pyodbc>=5.2.0",
]
# The Foundry hosting SDK, needed only to serve the Responses protocol locally
# or in a Hosted Agent container. Kept optional so the tests and the agent core
# never depend on the protocol server.
hosting = [
    "langchain-azure-ai[hosting]>=1.2.4",
]

[project.scripts]
# Thin adapters over package functions. Both return meaningful exit codes:
# 0 ready, 1 a check failed, 2 the check could not run.
eaof-verify = "enterprise_agents_on_foundry.cli.verify:main"
eaof-db-info = "enterprise_agents_on_foundry.cli.database_info:main"
# Starts the Responses protocol host. Requires the 'hosting' extra and a
# signed-in identity: uv sync --extra hosting && az login && uv run eaof-host.
eaof-host = "enterprise_agents_on_foundry.hosting.app:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[[tool.uv.index]]
# Microsoft-managed devices block direct access to pypi.org and
# files.pythonhosted.org. Route uv through the approved Central Feed Services
# proxy instead. default = true disables the implicit PyPI index, so package
# discovery and wheel downloads both go through the proxy and nothing reaches
# pypi.org.
name = "microsoft-cfs"
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "nbformat>=5.10.4",
    # Also declared as the 'database' extra for runtime consumers. It is repeated
    # here so that 'uv sync' alone is enough to run 'pytest -m azure'.
    "pyodbc>=5.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "S",    # bandit security rules
    "SIM",  # simplification
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# assert is the expected idiom in the test suite.
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
# pyodbc is an optional extra without bundled stubs.
module = ["pyodbc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Foundry hosting SDK is an optional extra imported lazily by the host.
module = ["langchain_azure_ai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "azure: requires a provisioned Azure environment, a signed-in identity, and the ODBC driver",
]
