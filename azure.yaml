# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: enterprise-agents-on-foundry
metadata:
  template: enterprise-agents-on-foundry@0.1.0

# v0.1 provisions infrastructure only. No service is deployed, because the
# LangGraph application is not migrated in this release and hosted agents are
# explored later. Adding a services section before there is something to host
# would only create an empty deployment target.

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    windows:
      shell: pwsh
      continueOnError: false
      interactive: true
      run: uv run python scripts/preprovision_check.py
    posix:
      shell: sh
      continueOnError: false
      interactive: true
      run: uv run python scripts/preprovision_check.py
  postprovision:
    windows:
      shell: pwsh
      continueOnError: false
      interactive: false
      run: uv run python scripts/write_env_from_azd.py
    posix:
      shell: sh
      continueOnError: false
      interactive: false
      run: uv run python scripts/write_env_from_azd.py
